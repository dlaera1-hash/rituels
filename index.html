<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rituels</title>
  <meta name="description" content="Suivi d'habitudes quotidien, hors ligne, sans compte.">
  <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rituels">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem("rituels:theme")||"verre";if(t&&t!=="classique"){document.documentElement.dataset.theme=t;document.documentElement.dataset.glass="";}}catch(e){}</script>
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Navigation">
    <button class="tab on" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/></svg>
      <span>Aujourd'hui</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4z"/></svg>
      <span>Calendrier</span>
    </button>
    <button class="tab" data-tab="habits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Habitudes</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet"><div id="sheet-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
